# Fly.io config for the Blak Shepherd WEF site.
# App name must be globally unique on Fly; change it if `fly launch` reports a clash.
app = "blakshepherd-wef"
primary_region = "jnb"  # Johannesburg, the closest Fly region to Nigeria

[build]

[env]
  # Forces config.py to require a real SECRET_KEY (set via `fly secrets set`).
  FLASK_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm so a public donor never waits on a cold start.
  # auto_start still covers traffic spikes; the last machine is never stopped.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
