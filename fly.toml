# Fly.io config for the Blak Shepherd WEF site.
# App name must be globally unique on Fly; change it if `fly launch` reports a clash.
app = "blakshepherd-wef"
primary_region = "jnb"  # Johannesburg, the closest Fly region to Nigeria

[build]

[env]
  # Forces config.py to require a real SECRET_KEY (set via `fly secrets set`).
  FLASK_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle and auto-wake on the next request. This keeps cost
  # near zero and avoids Railway-style "Application not found" outages, since
  # Fly boots the machine on an incoming HTTP request instead of 404ing.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
